<script>
(async function(){
  const $=s=>document.querySelector(s), PAGE=9;
  let all=[], tag='All', shown=PAGE;
  try{ all=await BS.listPosts(); }catch(e){ $('#grid').innerHTML='<div class="empty"><b>Could not load posts</b>Please refresh the page.</div>'; $('#count').textContent=''; return; }

  const tags=['All',...new Set(all.map(p=>p.tag).filter(Boolean))];
  $('#chips').innerHTML=tags.length>2?tags.map(t=>`<button class="${t===tag?'on':''}" data-t="${BS.esc(t)}">${BS.esc(t)}</button>`).join(''):'';

  const qp=new URLSearchParams(location.search); if(qp.get('q')) $('#q').value=qp.get('q');

  function view(){
    const q=$('#q').value.trim().toLowerCase();
    $('#sbox').classList.toggle('has',!!q);
    let list=all.filter(p=>(tag==='All'||p.tag===tag)&&(!q||(p.title+' '+p.body+' '+p.tag).toLowerCase().includes(q)));
    list.sort((a,b)=>$('#sort').value==='old'?a.createdAt-b.createdAt:b.createdAt-a.createdAt);
    const part=list.slice(0,shown);
    $('#grid').innerHTML=part.length?part.map(BS.card).join(''):`<div class="empty"><b>${all.length?'No posts found':'Coming soon'}</b>${all.length?'Try a different keyword or clear the filters.':'New projects and updates will be posted here.'}</div>`;
    BS.fillMissingCovers($('#grid'));
    $('#count').textContent=all.length?(q||tag!=='All'?`${list.length} result${list.length===1?'':'s'}`:`${all.length} post${all.length===1?'':'s'}`):'';
    $('#more').style.display=list.length>shown?'inline-flex':'none';
  }
  let t; $('#q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{shown=PAGE;view()},150)});
  $('#clr').onclick=()=>{$('#q').value='';shown=PAGE;view();$('#q').focus()};
  $('#sort').onchange=()=>{shown=PAGE;view()};
  $('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;tag=b.dataset.t;shown=PAGE;
    document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x===b));view()};
  $('#more').onclick=()=>{shown+=PAGE;view()};
  view();
})();
</script>
