<script>
(async function(){
  const $=s=>document.querySelector(s);
  const id=new URLSearchParams(location.search).get('id');
  const notFound=()=>{ $('#view').innerHTML='<div class="empty" style="padding:60px 20px"><b>Post not found</b>This post may have been removed. <br><br><a class="btn y" href="posts.html">Browse all posts</a></div>'; document.title='Post not found — Biswajit Santra'; };
  if(!id){ notFound(); return; }

  let p; try{ p=await BS.getPost(id); }catch(e){ $('#view').innerHTML='<div class="empty" style="padding:60px 20px"><b>Could not load this post</b>Please refresh the page.</div>'; return; }
  if(!p){ notFound(); return; }

  document.title=p.title+' — Biswajit Santra';
  const url=location.href;
  $('#view').innerHTML=`
    ${p.images.length?`<div class="gal"><img class="main" id="main" src="${p.images[0]}" alt="${BS.esc(p.title)}"></div>
    ${p.images.length>1?`<div class="thumbs">${p.images.map((s,i)=>`<img src="${s}" data-i="${i}" class="${i?'':'on'}" alt="">`).join('')}</div>`:''}`:''}
    <article class="art">
      <div class="meta">${p.tag?`<span class="ptag">${BS.esc(p.tag)}</span>`:''}<time>${BS.fmt(p.createdAt)}</time></div>
      <h1>${BS.esc(p.title)}</h1>
      <div class="txt">${BS.linkify(p.body)}</div>
      <div class="acts">
        ${p.link?`<a class="btn y" href="${BS.esc(p.link)}" target="_blank" rel="noopener">View Project ↗</a>`:''}
        <a class="btn o" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(p.title+' — '+url)}">Share on WhatsApp</a>
        <button class="btn o" id="copy">Copy link</button>
      </div>
    </article>`;

  const main=$('#main'), lb=$('#lb');
  document.querySelectorAll('.thumbs img').forEach(t=>t.onclick=()=>{main.src=t.src;document.querySelectorAll('.thumbs img').forEach(x=>x.classList.toggle('on',x===t))});
  if(main){ main.onclick=()=>{lb.querySelector('img').src=main.src;lb.classList.add('open')}; lb.onclick=()=>lb.classList.remove('open'); addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open')}); }
  $('#copy').onclick=async e=>{ try{await navigator.clipboard.writeText(url);e.target.textContent='Copied ✓'}catch(_){prompt('Copy this link:',url)} setTimeout(()=>e.target.textContent='Copy link',1800); };

  /* More Posts & Updates */
  try{
    const others=(await BS.listPosts()).filter(x=>x.id!==id);
    if(others.length){ $('#moreGrid').innerHTML=others.slice(0,3).map(BS.card).join(''); BS.fillMissingCovers($('#moreGrid')); $('#moreSec').style.display='block'; }
  }catch(e){}
})();
</script>
